<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://finance.naver.com https://polling.finance.naver.com; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>계좌통합 리밸런싱</title>
<style>
:root {
  color-scheme: light;
  --paper: #f3f6f7; --surface: #ffffff; --sunk: #f7f9fa;
  --ink: #10222c; --ink-2: #47596a; --ink-3: #7a8a96;
  --line: #dbe3e8; --line-2: #eaeff2;
  --sea: #0b6b5c; --sea-2: #0f8672; --sea-wash: #e4f2ee;
  --buy: #c8372d; --buy-wash: #fbecea; --sell: #1f64c8; --sell-wash: #e9f0fb;
  --warn: #9a5b00; --warn-wash: #fdf2dc; --bad: #b3261e; --bad-wash: #fbe9e7;
  --cur: #2a78d6; --tgt: #eb6834;
  --keep: #118f5c; --keep-wash: #e3f3e9; --exit: #2a78d6; --exit-wash: #e6effc; --new: #eb6834; --new-wash: #fdece2;
  --r: 10px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 20px 64px; }

.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px 0 14px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-right: auto; }
.brand h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.brand .sub { color: var(--ink-3); font-size: 12.5px; }
.feed { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.feed i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.feed.live i { background: #0ca30c; box-shadow: 0 0 0 3px rgba(12,163,12,.18); }
.feed.closed i { background: var(--sea); }
.feed.stale i { background: #e08a00; }
.feed.off i { background: var(--bad); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 13px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--sea); border-color: var(--sea); color: #fff; }
.btn.primary:hover { background: var(--sea-2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--sea-2); outline-offset: 1px; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { padding: 13px 16px; border-left: 1px solid var(--line-2); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi .l { display: block; font-size: 12px; color: var(--ink-3); }
.kpi b { display: block; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .s { display: block; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tabs { display: flex; gap: 2px; margin: 18px 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; font-weight: 600; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--sea); border-bottom-color: var(--sea); }
.tabs button .n { font-weight: 700; color: var(--ink-3); margin-left: 4px; font-size: 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; }
.card > header { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 11px 14px; border-bottom: 1px solid var(--line-2); }
.card > header h2, .card > header h3 { font-size: 15px; font-weight: 700; }
.card > header .meta { color: var(--ink-2); font-size: 12.5px; }
.card > header .sp { margin-left: auto; }
.card .pad { padding: 14px; }
.scroll { overflow-x: auto; }
.note { color: var(--ink-2); font-size: 12.5px; }
.note b { color: var(--ink); }

table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: right; font-weight: 600; color: var(--ink-3); font-size: 12px; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--sunk); }
table.t th.l, table.t td.l { text-align: left; }
table.t th.c, table.t td.c { text-align: center; }
table.t td { padding: 6px 10px; border-bottom: 1px solid var(--line-2); text-align: right; white-space: nowrap; vertical-align: middle; }
table.t tbody tr:last-child td { border-bottom: 0; }
table.t tfoot td { border-top: 1px solid var(--line); border-bottom: 0; font-weight: 700; background: var(--sunk); }
table.t td.sec { text-align: left; vertical-align: top; border-right: 1px solid var(--line-2); background: var(--sunk); min-width: 92px; }
table.t td.sec b { display: block; font-size: 13px; }
table.t td.sec span { display: block; font-size: 11.5px; color: var(--ink-2); }
table.t td.nm { text-align: left; white-space: normal; min-width: 200px; max-width: 320px; }
table.t.dense { font-size: 13px; } table.t.dense th, table.t.dense td { padding-left: 7px; padding-right: 7px; }
table.t select { min-width: 96px; }
.dep-box { border-top: 1px solid var(--line-2); }
.dep-box summary { cursor: pointer; padding: 10px 14px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.dep-box summary:hover { color: var(--ink); }
table.t td.nm .code { color: var(--ink-3); font-size: 11.5px; margin-left: 6px; }
table.t tr.cash td.nm { color: var(--ink-2); }
table.t .mut { color: var(--ink-3); }
table.t input[type=number], table.t input[type=text], table.t input[type=date], table.t select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; background: #fffdf3; text-align: right; width: 100%; min-width: 0; }
table.t input[type=text], table.t select { text-align: left; }
table.t input.q { width: 104px; } table.t input.p { width: 72px; } table.t input.w { width: 112px; } table.t input.d { width: 132px; }
table.t input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--sea); }
.pos { color: var(--buy); font-weight: 600; } .neg { color: var(--sell); font-weight: 600; }
.x { border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 4px; }
.x:hover { color: var(--bad); background: var(--bad-wash); }

/* 보유 상태별 행 색상: 잔고·목표와 단계 이동에서 같은 색 */
table.t tr.rk-keep > td:not(.sec) { background: var(--keep-wash); }
table.t tr.rk-exit > td:not(.sec) { background: var(--exit-wash); }
table.t tr.rk-new > td:not(.sec) { background: var(--new-wash); }
table.t tr.rk-keep > td.nm { box-shadow: inset 4px 0 0 var(--keep); }
table.t tr.rk-exit > td.nm { box-shadow: inset 4px 0 0 var(--exit); }
table.t tr.rk-new > td.nm { box-shadow: inset 4px 0 0 var(--new); }
table.t tr[class^="rk-"] > td { border-bottom-color: var(--surface); }
table.t tr[class^="rk-"] > td.nm { padding-left: 14px; }
.kd { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.kd i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.kd.keep i { background: var(--keep); } .kd.exit i { background: var(--exit); } .kd.new i { background: var(--new); }
.kd-legend { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; font-size: 12.5px; color: var(--ink-2); }
.kd-legend .t { font-weight: 700; color: var(--ink); margin-right: 4px; }
.kd-legend .lg { display: inline-flex; align-items: baseline; gap: 7px; padding: 5px 12px 5px 14px; border-radius: 6px; }
.kd-legend .lg b, .kd-legend .lg em { color: var(--ink); font-style: normal; font-weight: 700; }
.kd-legend .lg.keep { background: var(--keep-wash); box-shadow: inset 4px 0 0 var(--keep); }
.kd-legend .lg.exit { background: var(--exit-wash); box-shadow: inset 4px 0 0 var(--exit); }
.kd-legend .lg.new { background: var(--new-wash); box-shadow: inset 4px 0 0 var(--new); }
.card > .kd-legend { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line-2); }

/* 회차 수 선택 */
.seg-row { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line-2); }
.seg-row .lab { font-weight: 700; font-size: 13.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-left: 1px solid var(--line); background: none; min-width: 38px; padding: 6px 0; cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--ink-2); }
.seg button:first-child { border-left: 0; }
.seg button:hover:not(:disabled):not([aria-pressed="true"]) { background: var(--sunk); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.seg button:disabled { color: #b9c5cd; cursor: default; }
.seg button:focus-visible { outline-offset: -2px; }

/* 회차별 매매 수량표 */
table.t.sch th span { display: block; font-weight: 500; font-size: 11px; }
table.t.sch th.now { color: var(--ink); } table.t.sch th.now span { color: var(--sea); font-weight: 700; }
table.t.sch th.dn span { color: var(--sea); }
table.t tr.grp > td { background: var(--sunk); font-weight: 700; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
table.t.sch tbody tr.grp:first-child > td { border-top: 0; }
table.t.ord td b.neg, table.t.ord td b.pos { font-weight: 700; }
table.t.sch td.nm { position: sticky; left: 0; z-index: 1; background: var(--surface); }
table.t.sch th:first-child { position: sticky; left: 0; z-index: 2; }

.tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.tag.S { color: var(--sell); background: var(--sell-wash); } .tag.B { color: var(--buy); background: var(--buy-wash); } .tag.H { color: var(--warn); background: var(--warn-wash); }
.badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--sea-wash); color: var(--sea); }
.badge.warn { background: var(--warn-wash); color: var(--warn); } .badge.bad { background: var(--bad-wash); color: var(--bad); } .badge.mut { background: var(--line-2); color: var(--ink-2); }

.acc-head input.name { border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; font-weight: 700; font-size: 15px; width: 190px; background: transparent; }
.acc-head input.no { border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; font-size: 12.5px; color: var(--ink-2); width: 150px; background: transparent; }
.acc-head input.name:hover, .acc-head input.no:hover, .acc-head input.name:focus, .acc-head input.no:focus { border-color: var(--line); background: #fffdf3; }
.acc-head label { font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; }
.acc-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 14px; border-top: 1px solid var(--line-2); }
.acc-foot select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--surface); max-width: 320px; }

.empty { text-align: center; padding: 44px 20px; }
.empty h2 { font-size: 19px; margin-bottom: 8px; }
.empty p { color: var(--ink-2); max-width: 560px; margin: 0 auto 18px; }
.empty .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* 단계 진행 경로 */
.route-wrap { padding: 12px 14px 6px; }
svg.route { display: block; width: 100%; height: auto; }
.route .base { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.route .done { stroke: var(--sea); stroke-width: 3; stroke-linecap: round; }
.route .wp { fill: var(--surface); stroke: #b9c5cd; stroke-width: 2.5; }
.route .wp.d { fill: var(--sea); stroke: var(--sea); }
.route .wp.c { stroke: var(--sea); stroke-width: 4; }
.route .wp.s { stroke-dasharray: 3 3; }
.route text { font-size: 13px; fill: var(--ink-2); }
.route text.h { font-weight: 700; fill: var(--ink); }
.route .ship { fill: var(--tgt); stroke: var(--surface); stroke-width: 2; }
.route-leg { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); padding: 0 14px 12px; }
.route-leg i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.route-leg i.a { background: var(--tgt); clip-path: polygon(50% 0, 100% 100%, 50% 75%, 0 100%); }
.route-leg i.p { background: var(--sea); border-radius: 50%; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 13px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip .st { font-weight: 500; opacity: .75; margin-left: 4px; }
.ord-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin: 18px 0 10px; }
.ord-head h2 { font-size: 16px; }
.ord-sum { display: flex; gap: 4px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.ord-sum b { color: var(--ink); }
.w3 { color: var(--ink-2); } .w3 b { color: var(--ink); }
.inline-set { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line-2); font-size: 13px; }
.inline-set input[type=number] { width: 64px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; background: #fffdf3; text-align: right; }

/* 막대(현재 vs 목표) */
.bars { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 9px 12px; align-items: center; padding: 6px 14px 14px; }
.bars .lab { font-size: 13px; color: var(--ink-2); text-align: right; }
.bars .pair { display: grid; gap: 2px; }
.bars .bar { display: flex; align-items: center; gap: 7px; height: 11px; }
.bars .bar span { display: block; height: 100%; min-width: 1px; border-radius: 0 4px 4px 0; }
.bars .bar.c span { background: var(--cur); } .bars .bar.g span { background: var(--tgt); }
.bars .bar em { font-style: normal; font-size: 11.5px; color: var(--ink-2); line-height: 1; }
.legend { display: flex; gap: 16px; padding: 12px 14px 4px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.dbar { display: inline-block; height: 8px; border-radius: 0 4px 4px 0; background: var(--cur); vertical-align: middle; margin-left: 8px; min-width: 1px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 14px; align-items: start; }

.tk-add { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 14px; position: relative; }
.tk-add input, .tk-add select, .set-row input, .set-row select { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); }
.tk-add input { flex: 1 1 280px; }
.tk-res { flex-basis: 100%; }
.tk-res div { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-bottom: 1px solid var(--line-2); font-size: 13.5px; }
.tk-res div .code { color: var(--ink-3); width: 62px; }
.tk-res div .nm { flex: 1; }

.set-row { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line-2); }
.set-row:last-child { border-bottom: 0; }
.set-row .lab { width: 170px; font-weight: 600; }
.set-row .desc { color: var(--ink-2); font-size: 12.5px; flex: 1 1 260px; }
.set-row input[type=number] { width: 84px; text-align: right; }

dialog { border: 0; border-radius: 12px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); color: var(--ink); box-shadow: 0 18px 50px rgba(16,34,44,.28); }
dialog::backdrop { background: rgba(16,34,44,.45); }
.dlg { padding: 20px 22px; }
.dlg h2 { font-size: 17px; margin-bottom: 6px; }
.dlg h3 { font-size: 14px; margin: 16px 0 6px; }
.dlg p { color: var(--ink-2); font-size: 13px; }
.dlg .act { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; position: sticky; bottom: 0; background: var(--surface); padding-top: 10px; }
.dlg .dep { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
.dlg .dep input { width: 130px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; text-align: right; background: #fffdf3; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px); z-index: 50; }
#toast.on { opacity: 1; }
.alert { border: 1px solid #efd9a6; background: var(--warn-wash); color: #5c3a00; border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px; }
.alert.bad { border-color: #efc1bc; background: var(--bad-wash); color: #7a1a14; }

@media (max-width: 980px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { border-left: 0; border-top: 1px solid var(--line-2); }
  .kpi:nth-child(-n+2) { border-top: 0; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .wrap { padding: 0 12px 48px; }
}
@media (max-width: 720px) { table.t.sch td.nm, table.t.ord td.nm { min-width: 128px; max-width: 150px; } }
@media (max-width: 480px) { .seg button { min-width: 29px; } }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media print { .top .btn, .tabs, .acc-foot, .x { display: none !important; } body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>계좌통합 리밸런싱</h1>
      <span class="sub">현재 잔고에서 목표 포트폴리오까지 회차별로 이동</span>
    </div>
    <span id="feed" class="feed off" role="status"><i></i><span>시세 조회 중</span></span>
    <button class="btn" id="btnRefresh" type="button">시세 새로고침</button>
  </header>
  <section id="kpis" class="kpis" aria-label="요약"></section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="화면 선택"></nav>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<input type="file" id="fileXlsx" accept=".xlsx,.xlsm" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* 계좌통합 리밸런싱 - 계산 엔진 (화면과 분리된 순수 함수) */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RB = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var SECTORS = ['미국주식', '한국주식', '3국주식', '미국배당', '한국배당', '혼합', '미국채권', '한국채권', '대체투자', '현금성'];
  var SAFE_SECTORS = ['혼합', '미국채권', '한국채권', '현금성'];
  var CASH = 'CASH';
  var EPS = 1e-6;

  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (v == null) return 0;
    var n = parseFloat(String(v).replace(/,/g, ''));
    return isFinite(n) ? n : 0;
  }
  // 엑셀 ROUND 와 같은 반올림(0에서 먼 쪽)
  function xround(x) { return (x < 0 ? -1 : 1) * Math.round(Math.abs(x)); }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function uid() { return 'a' + Math.random().toString(36).slice(2, 9); }
  /* 보유 상태: keep=지금 보유·최종에도 보유, exit=지금 보유·최종 목표 0%, new=지금 없음·최종에 보유 */
  function rowKind(qty, target) {
    var has = num(qty) > 0, want = num(target) > 0;
    return has && want ? 'keep' : (has ? 'exit' : (want ? 'new' : ''));
  }

  function normCode(v) {
    if (v == null) return '';
    if (typeof v === 'number') return (Math.floor(v) === v && v >= 0 && v < 1e6) ? ('000000' + v).slice(-6) : '';
    var s = String(v).trim().toUpperCase();
    if (s === CASH) return CASH;
    if (/^\d{1,6}$/.test(s)) return ('000000' + s).slice(-6);
    return /^[0-9A-Z]{6}$/.test(s) ? s : '';
  }

  function newPlan(n) {
    n = clamp(Math.round(num(n)) || 4, 1, 12);
    var rounds = [];
    for (var i = 1; i <= n; i++) rounds.push({ pct: i === n ? 100 : Math.round(1000 * i / n) / 10, date: '', deposits: {}, done: false });
    return { rounds: rounds, baseGap: null, baseAt: null };
  }

  function newState() {
    return {
      v: 1, tickers: [], accounts: [], plan: newPlan(4), history: [],
      settings: { riskLimit: 70, refreshSec: 10 },
      quotes: { ts: 0, src: '', market: '', map: {} }
    };
  }

  function tickerOf(state, code) {
    for (var i = 0; i < state.tickers.length; i++) if (state.tickers[i].code === code) return state.tickers[i];
    return null;
  }
  function tickerIndex(state) {
    var m = {};
    state.tickers.forEach(function (t, i) { m[t.code] = i; });
    return m;
  }
  function ensureCash(acc) {
    for (var i = 0; i < acc.rows.length; i++) if (acc.rows[i].code === CASH) return acc.rows[i];
    var r = { code: CASH, qty: 0, target: 0 };
    acc.rows.push(r);
    return r;
  }
  function priceOf(state, code) {
    if (code === CASH) return 1;
    var t = tickerOf(state, code);
    if (t && num(t.manual) > 0) return num(t.manual);
    var q = state.quotes && state.quotes.map ? state.quotes.map[code] : null;
    return q && q.p > 0 ? q.p : null;
  }
  function displayName(state, code) {
    if (code === CASH) return '예수금(현금)';
    var t = tickerOf(state, code);
    var q = state.quotes && state.quotes.map ? state.quotes.map[code] : null;
    return (t && (t.short || t.name)) || (q && q.n) || code;
  }

  /* 계좌 1개 계산: 엑셀 리밸런싱 시트의 E~N열과 같은 로직
     opts.rows    : 수량을 바꿔 가정 계산할 때(단계 시뮬레이션)
     opts.deposit : 이번 회차 추가 납입금(예수금에 더함) */
  function calcAccount(state, acc, opts) {
    opts = opts || {};
    var src = opts.rows || acc.rows;
    var deposit = num(opts.deposit);
    var order = tickerIndex(state);
    var rows = src.map(function (r, i) {
      var isCash = r.code === CASH;
      var t = isCash ? null : tickerOf(state, r.code);
      var price = priceOf(state, r.code);
      var qty = num(r.qty) + (isCash ? deposit : 0);
      return {
        i: i, code: r.code, isCash: isCash,
        sector: isCash ? '현금성' : ((t && t.sector) || '미분류'),
        name: displayName(state, r.code),
        safe: isCash || !!(t && t.safe),
        price: price, qty: qty, target: num(r.target),
        kind: isCash ? '' : rowKind(qty, r.target),
        value: price != null ? price * qty : null,
        ord: isCash ? 1e9 : (order[r.code] != null ? order[r.code] : 1e8)
      };
    });
    if (deposit && !rows.some(function (r) { return r.isCash; })) {
      rows.push({ i: -1, code: CASH, isCash: true, sector: '현금성', name: '예수금(현금)', safe: true, price: 1, qty: deposit, target: 0, kind: '', value: deposit, ord: 1e9 });
    }
    var total = 0, sumTarget = 0, missing = false;
    rows.forEach(function (r) {
      total += r.value || 0;
      sumTarget += r.target;
      if (r.value == null && (r.qty > 0 || r.target > 0)) missing = true;
    });
    sumTarget = Math.round(sumTarget * 1e6) / 1e6;
    var gap = 0, riskCur = 0, riskTgt = 0, cash = 0, cashLike = 0;
    rows.forEach(function (r) {
      r.curW = total > 0 && r.value != null ? r.value / total : 0;
      r.tgtAmt = total * r.target / 100;
      r.tgtQty = r.price > 0 ? r.tgtAmt / r.price : null;
      r.adj = r.tgtQty != null ? xround(r.tgtQty - r.qty) : null;
      r.adjAmt = r.adj != null ? r.adj * r.price : null;
      gap += Math.abs(r.tgtAmt - (r.value || 0));
      if (!r.safe) { riskCur += r.value || 0; riskTgt += r.target; }
      if (r.isCash) cash += r.value || 0;
      if (r.sector === '현금성') cashLike += r.value || 0;
    });
    var sidx = {};
    SECTORS.forEach(function (s, i) { sidx[s] = i; });
    rows.sort(function (a, b) {
      var sa = sidx[a.sector] != null ? sidx[a.sector] : 99, sb = sidx[b.sector] != null ? sidx[b.sector] : 99;
      return sa - sb || a.ord - b.ord || a.i - b.i;
    });
    var sectors = {};
    rows.forEach(function (r) {
      var s = sectors[r.sector] || (sectors[r.sector] = { curAmt: 0, tgtAmt: 0, tgtW: 0, n: 0 });
      s.curAmt += r.value || 0; s.tgtAmt += r.tgtAmt; s.tgtW += r.target; s.n++;
    });
    Object.keys(sectors).forEach(function (k) { sectors[k].curW = total > 0 ? sectors[k].curAmt / total : 0; });
    return {
      id: acc.id, name: acc.name, risk: !!acc.risk, rows: rows, total: total, sumTarget: sumTarget,
      targetOk: Math.abs(sumTarget - 100) < EPS, missing: missing,
      gap: gap / 2, cash: cash, cashLike: cashLike, sectors: sectors,
      riskCur: total > 0 ? riskCur / total * 100 : 0, riskTgt: riskTgt, deposit: deposit
    };
  }

  /* 전체 통합 계산: 엑셀 하단의 계좌별/섹터별/ETF별 요약 */
  function calcAll(state) {
    var accs = state.accounts.map(function (a) { return calcAccount(state, a); });
    var total = 0, cashLike = 0, gap = 0, tgtTotal = 0, planOk = accs.length > 0;
    accs.forEach(function (c) {
      total += c.total; cashLike += c.cashLike;
      if (c.targetOk) { gap += c.gap; } else if (c.total > 0) planOk = false;
      tgtTotal += c.total * c.sumTarget / 100;
    });
    var sectors = SECTORS.map(function (s) {
      var o = { sector: s, curAmt: 0, tgtAmt: 0, per: {} };
      accs.forEach(function (c) {
        var x = c.sectors[s];
        if (x) { o.curAmt += x.curAmt; o.tgtAmt += x.tgtAmt; o.per[c.id] = x.tgtW; } else o.per[c.id] = 0;
      });
      o.curW = total > 0 ? o.curAmt / total : 0;
      o.tgtW = tgtTotal > 0 ? o.tgtAmt / tgtTotal : 0;
      return o;
    });
    var map = {}, etfs = [];
    accs.forEach(function (c) {
      c.rows.forEach(function (r) {
        var e = map[r.code];
        if (!e) { e = map[r.code] = { code: r.code, isCash: r.isCash, sector: r.sector, name: r.name, price: r.price, qty: 0, value: 0, tgtAmt: 0, per: {}, ord: r.ord }; etfs.push(e); }
        e.qty += r.qty; e.value += r.value || 0; e.tgtAmt += r.tgtAmt;
        e.per[c.id] = (e.per[c.id] || 0) + (r.value || 0);
      });
    });
    var sidx = {};
    SECTORS.forEach(function (s, i) { sidx[s] = i; });
    etfs.sort(function (a, b) { return (sidx[a.sector] != null ? sidx[a.sector] : 99) - (sidx[b.sector] != null ? sidx[b.sector] : 99) || a.ord - b.ord; });
    etfs.forEach(function (e) { e.w = total > 0 ? e.value / total : 0; e.tgtW = tgtTotal > 0 ? e.tgtAmt / tgtTotal : 0; });
    return { accounts: accs, total: total, cashLike: cashLike, invested: total - cashLike, gap: gap, planOk: planOk, sectors: sectors, etfs: etfs, tgtTotal: tgtTotal };
  }

  /* 회차 k(0부터)의 이동 비율: 남은 격차 중 이번에 옮길 몫 */
  function roundFrac(plan, k) {
    var prev = 0;
    for (var i = 0; i < k; i++) prev = Math.max(prev, num(plan.rounds[i].pct));
    var cur = num(plan.rounds[k].pct);
    if (100 - prev <= EPS) return 1;
    return clamp((cur - prev) / (100 - prev), 0, 1);
  }
  function currentRound(state) {
    var rs = state.plan.rounds;
    for (var i = 0; i < rs.length; i++) if (!rs[i].done) return i;
    return -1;
  }

  /* 계좌 1개의 한 회차 주문표.
     c: calcAccount 결과(납입금 반영 후), f: 남은 격차 중 이번 회차 이동 비율(0~1) */
  function planRound(state, c, f) {
    var res = { ok: false, reason: '', f: f, orders: [], sellAmt: 0, buyAmt: 0, heldSell: 0, heldBuy: 0, deposit: c.deposit, cashBefore: c.cash, cashAfter: c.cash, after: [], riskBefore: c.riskCur, riskAfter: c.riskCur, gapBefore: c.gap, gapAfter: c.gap, total: c.total };
    if (c.total <= 0) { res.reason = '잔고가 없습니다.'; return res; }
    if (!c.targetOk) { res.reason = '목표 비중 합계가 100%가 아닙니다 (현재 ' + c.sumTarget.toFixed(1) + '%).'; return res; }
    res.ok = true;
    var buys = [], wantTotal = 0, cashRow = null;
    c.rows.forEach(function (r) {
      if (r.isCash) { cashRow = r; return; }
      if (!(r.price > 0)) {
        if (r.qty > 0 || r.target > 0) res.orders.push({ side: 'H', code: r.code, name: r.name, sector: r.sector, qty: 0, price: null, amount: 0, held: true, reason: '가격 미확인', row: r });
        return;
      }
      var t = tickerOf(state, r.code) || {};
      var gapAmt = r.tgtAmt - r.value;
      var step = f * gapAmt;
      if (step < -EPS) {
        var q = f >= 1 - EPS ? xround(-gapAmt / r.price) : Math.round(-step / r.price);
        if (f >= 1 - EPS && r.target === 0) q = r.qty;
        q = Math.min(q, r.qty);
        if (q <= 0) return;
        var hs = num(t.sellMin) > 0 && r.price < num(t.sellMin);
        res.orders.push({ side: 'S', code: r.code, name: r.name, sector: r.sector, qty: q, price: r.price, amount: q * r.price, held: hs, reason: hs ? '현재가가 매도 하한가(' + Math.round(num(t.sellMin)).toLocaleString('ko-KR') + '원)보다 낮음' : '', row: r });
        if (hs) res.heldSell += q * r.price; else res.sellAmt += q * r.price;
      } else if (step > EPS) {
        var hb = num(t.buyMax) > 0 && r.price > num(t.buyMax);
        var o = { side: 'B', code: r.code, name: r.name, sector: r.sector, qty: 0, price: r.price, amount: 0, want: step, held: hb, reason: hb ? '현재가가 매수 상한가(' + Math.round(num(t.buyMax)).toLocaleString('ko-KR') + '원)보다 높음' : '', row: r };
        res.orders.push(o);
        if (hb) res.heldBuy += step; else { buys.push(o); wantTotal += step; }
      }
    });
    var cashNow = cashRow ? cashRow.value : 0;
    var cashTgt = cashRow ? cashRow.tgtAmt : 0;
    var cashPlan = Math.max(0, cashNow + f * (cashTgt - cashNow));
    var budget = Math.max(0, cashNow + res.sellAmt - cashPlan);
    var scale = wantTotal > 0 ? Math.min(1, budget / wantTotal) : 0;
    var spent = 0;
    buys.forEach(function (o) {
      var exact = o.want * scale / o.price;
      o.qty = Math.floor(exact + 1e-9);
      o.frac = exact - o.qty;
      spent += o.qty * o.price;
    });
    // 반올림 몫: 0.5주 이상 남은 종목은 예수금이 허용하는 범위에서 1주 추가(엑셀 ROUND와 같은 결과)
    buys.slice().sort(function (a, b) { return b.frac - a.frac; }).forEach(function (o) {
      if (o.frac >= 0.5 - 1e-9 && cashNow + res.sellAmt - spent - o.price >= -1e-6) { o.qty += 1; spent += o.price; }
    });
    buys.forEach(function (o) { o.amount = o.qty * o.price; if (scale < 0.995 && !o.reason) o.reason = '매수 재원 부족으로 축소'; });
    res.buyAmt = spent;
    res.cashAfter = cashNow + res.sellAmt - spent;
    res.orders = res.orders.filter(function (o) { return o.held || o.qty > 0; });
    var rank = { S: 0, B: 1, H: 2 };
    res.orders.sort(function (a, b) { return (a.held ? 1 : 0) - (b.held ? 1 : 0) || rank[a.side] - rank[b.side] || b.amount - a.amount; });
    // 회차 후 상태
    var delta = {};
    res.orders.forEach(function (o) { if (!o.held) delta[o.code] = (o.side === 'S' ? -1 : 1) * o.qty; });
    var total2 = 0;
    res.after = c.rows.map(function (r) {
      var q2 = r.isCash ? res.cashAfter : r.qty + (delta[r.code] || 0);
      var v2 = r.price != null ? r.price * q2 : 0;
      total2 += v2;
      return { i: r.i, code: r.code, isCash: r.isCash, qty: q2, value: v2, target: r.target, safe: r.safe };
    });
    var gap2 = 0, risk2 = 0;
    res.after.forEach(function (a) {
      a.w = total2 > 0 ? a.value / total2 : 0;
      gap2 += Math.abs(total2 * a.target / 100 - a.value);
      if (!a.safe) risk2 += a.value;
    });
    res.gapAfter = gap2 / 2;
    res.riskAfter = total2 > 0 ? risk2 / total2 * 100 : 0;
    var wAfter = {};
    res.after.forEach(function (a) { wAfter[a.code] = a.w; });
    res.orders.forEach(function (o) {
      o.curW = o.row.curW; o.aftW = wAfter[o.code]; o.tgtW = o.row.target / 100;
      o.have = o.row.qty; o.left = o.row.qty + (delta[o.code] || 0);   // 회차 전·후 보유 주식 수
      delete o.row;
    });
    return res;
  }

  /* 남은 모든 회차를 현재가 기준으로 차례로 가정 계산 */
  function simulate(state) {
    var plan = state.plan, out = [];
    var rowsBy = {};
    state.accounts.forEach(function (a) { rowsBy[a.id] = a.rows.map(function (r) { return { code: r.code, qty: num(r.qty), target: num(r.target) }; }); });
    plan.rounds.forEach(function (rd, k) {
      var f = roundFrac(plan, k);
      var item = { k: k, pct: num(rd.pct), date: rd.date || '', done: !!rd.done, f: f, accounts: [], sellAmt: 0, buyAmt: 0, deposit: 0, gapAfter: 0, held: 0 };
      if (!rd.done) {
        state.accounts.forEach(function (a) {
          var dep = num((rd.deposits || {})[a.id]);
          var c = calcAccount(state, a, { rows: rowsBy[a.id], deposit: dep });
          var p = planRound(state, c, f);
          item.accounts.push({ id: a.id, name: a.name, risk: !!a.risk, calc: c, plan: p });
          item.sellAmt += p.sellAmt; item.buyAmt += p.buyAmt; item.deposit += dep;
          item.gapAfter += p.ok ? p.gapAfter : 0;
          item.held += p.orders.filter(function (o) { return o.held; }).length;
          if (p.ok) {
            var rows = rowsBy[a.id], byCode = {};
            rows.forEach(function (r) { byCode[r.code] = r; });
            p.after.forEach(function (x) {
              if (byCode[x.code]) byCode[x.code].qty = x.qty;
              else if (x.isCash) rows.push({ code: CASH, qty: x.qty, target: 0 });
            });
          } else if (dep) {
            var cr = null;
            rowsBy[a.id].forEach(function (r) { if (r.code === CASH) cr = r; });
            if (cr) cr.qty += dep; else rowsBy[a.id].push({ code: CASH, qty: dep, target: 0 });
          }
        });
      }
      out.push(item);
    });
    return out;
  }

  /* 회차별 매매 수량표: 계좌·종목마다 회차별 주식 수(매수 +, 매도 −).
     완료한 회차는 이력의 실제 체결 수량, 남은 회차는 현재가 기준 예상 수량 */
  function schedule(state, sim) {
    sim = sim || simulate(state);
    var entryOf = function (rd, k) {
      var found = null;
      (state.history || []).forEach(function (e) {
        if (rd.doneId ? e.id === rd.doneId : (e.at === rd.doneAt && e.round === k + 1)) found = e;
      });
      return found;
    };
    return state.accounts.map(function (acc, ai) {
      var c = calcAccount(state, acc), rows = [], by = {};
      c.rows.forEach(function (r) {
        if (r.isCash) return;
        var x = { code: r.code, name: r.name, sector: r.sector, kind: r.kind, qty: r.qty, target: r.target, cells: [], end: r.qty, any: false };
        rows.push(x); by[r.code] = x;
      });
      state.plan.rounds.forEach(function (rd, k) {
        rows.forEach(function (x) { x.cells.push(null); });
        if (rd.done) {
          var e = entryOf(rd, k);
          if (!e) return;
          e.accounts.forEach(function (a) {
            if (a.accId !== acc.id) return;
            (a.trades || []).forEach(function (t) {
              var x = by[t.code];
              if (!x) return;
              var cell = x.cells[k] || (x.cells[k] = { q: 0, done: true });
              cell.q += (t.side === 'S' ? -1 : 1) * num(t.qty);
              x.any = true;
            });
          });
          return;
        }
        var it = sim[k] && sim[k].accounts[ai];
        if (!it || !it.plan.ok) return;
        it.plan.orders.forEach(function (o) {
          var x = by[o.code];
          if (!x) return;
          x.any = true;
          if (o.held) { x.cells[k] = { q: 0, held: true, side: o.side }; return; }
          var q = (o.side === 'S' ? -1 : 1) * o.qty;
          x.cells[k] = { q: q };
          x.end += q;
        });
      });
      return {
        id: acc.id, name: acc.name, ok: c.total > 0 && c.targetOk, total: c.total,
        rows: rows.filter(function (x) { return x.any || x.kind; })
      };
    });
  }

  function setBaseline(state) {
    var all = calcAll(state);
    state.plan.baseGap = all.gap;
    state.plan.baseAt = new Date().toISOString();
    return all.gap;
  }
  function progress(state, all) {
    all = all || calcAll(state);
    var base = num(state.plan.baseGap);
    var pct = base > 0 ? clamp(1 - all.gap / base, 0, 1) * 100 : (all.gap <= 0 && all.planOk ? 100 : 0);
    var planned = 0;
    state.plan.rounds.forEach(function (r) { if (r.done) planned = Math.max(planned, num(r.pct)); });
    return { gap: all.gap, base: base, pct: pct, planned: planned };
  }

  /* 체결 반영: fills = [{accId, deposit, trades:[{code, side:'S'|'B', qty, price}]}] */
  function executeRound(state, k, fills) {
    var rd = state.plan.rounds[k];
    var entry = { id: uid(), at: new Date().toISOString(), round: k + 1, pct: num(rd.pct), accounts: [], before: {} };
    fills.forEach(function (f) {
      var acc = null;
      state.accounts.forEach(function (a) { if (a.id === f.accId) acc = a; });
      if (!acc) return;
      entry.before[acc.id] = acc.rows.map(function (r) { return { code: r.code, qty: num(r.qty) }; });
      var cashRow = ensureCash(acc);
      var cash = num(cashRow.qty) + num(f.deposit);
      var log = [];
      (f.trades || []).forEach(function (t) {
        var q = Math.max(0, num(t.qty)), p = num(t.price);
        if (!(q > 0) || !(p > 0)) return;
        var row = null;
        acc.rows.forEach(function (r) { if (r.code === t.code) row = r; });
        if (!row) { row = { code: t.code, qty: 0, target: 0 }; acc.rows.push(row); }
        if (t.side === 'S') { q = Math.min(q, num(row.qty)); row.qty = num(row.qty) - q; cash += q * p; }
        else { row.qty = num(row.qty) + q; cash -= q * p; }
        log.push({ code: t.code, name: displayName(state, t.code), side: t.side, qty: q, price: p, amount: q * p });
      });
      cashRow.qty = Math.round(cash);
      entry.accounts.push({ accId: acc.id, name: acc.name, deposit: num(f.deposit), trades: log, cashAfter: cashRow.qty });
    });
    rd.done = true; rd.doneAt = entry.at; rd.doneId = entry.id;
    state.history.push(entry);
    return entry;
  }
  function undoLast(state) {
    var e = state.history.pop();
    if (!e) return null;
    state.accounts.forEach(function (acc) {
      var snap = e.before[acc.id];
      if (!snap) return;
      var m = {};
      snap.forEach(function (s) { m[s.code] = s.qty; });
      acc.rows.forEach(function (r) { if (m[r.code] != null) r.qty = m[r.code]; });
    });
    var rd = state.plan.rounds[e.round - 1];

  function searchTickers(qs) {
    var box = $('#tkRes');
    if (!box) return;
    var q = String(qs || '').trim().toUpperCase();
    if (q.length < 2) { box.innerHTML = ''; return; }
    var have = {}, out = [], map = S.quotes.map;
    S.tickers.forEach(function (t) { have[t.code] = 1; });
    var qn = q.replace(/\s+/g, '');
    Object.keys(map).forEach(function (code) {
      var n = String(map[code].n || ''), un = n.toUpperCase().replace(/\s+/g, ''), at = un.indexOf(qn);
      if (code.indexOf(qn) < 0 && at < 0) return;
      out.push({ code: code, n: n, p: map[code].p, rank: code === qn || un === qn ? 0 : (at === 0 ? 1 : 2) });
    });
    out.sort(function (a, b) { return a.rank - b.rank || a.n.length - b.n.length || (a.n < b.n ? -1 : 1); });
    out = out.slice(0, 12);
    var code6 = RB.normCode(q);
    if (code6 && code6 !== CASH && q.length === 6 && !map[code6]) out.unshift({ code: code6, n: '목록에 없는 코드 (시세는 다음 조회 때 확인)', p: null });
    box.innerHTML = out.length ? out.map(function (o) {
      return '<div><span class="code">' + esc(o.code) + '</span><span class="nm">' + esc(o.n) + '</span><span class="mut">' + (o.p ? fInt(o.p) + '원' : '') + '</span>' +
        (have[o.code] ? '<span class="badge mut">등록됨</span>' : '<button class="btn sm" data-act="tk.add" data-code="' + o.code + '">추가</button>') + '</div>';
    }).join('') : '<div class="note">일치하는 종목이 없습니다.' + (Object.keys(map).length < 100 ? ' 시세 목록을 아직 받지 못했습니다. 6자리 코드를 그대로 입력하면 추가할 수 있습니다.' : '') + '</div>';
  }

  function replan(n) {
    var rs = S.plan.rounds, done = rs.filter(function (r) { return r.done; });
    n = RB.clamp(Math.round(num(n)) || rs.length, minRounds(), 12);
    var base = done.length ? done[done.length - 1].pct : 0, rem = n - done.length, out = done.slice();
    for (var j = 1; j <= rem; j++) {
      var old = rs[done.length + j - 1];
      out.push({ pct: j === rem ? 100 : Math.round((base + (100 - base) * j / rem) * 10) / 10, date: old && !old.done ? old.date : '', deposits: old && !old.done ? old.deposits : {}, done: false });
    }
    S.plan.rounds = out;
    ui.round = null;
  }

      var a = S.accounts[+el.dataset.a], i = +el.dataset.i, r = a.rows[i];
      var go = function () { a.rows.splice(i, 1); save(); render(); };
      if (num(r.qty) > 0 || num(r.target) > 0) { confirmDlg('행 삭제', RB.displayName(S, r.code) + ' 행에는 보유수량이나 목표 비중이 들어 있습니다. 지우면 합계에서 빠집니다.', '삭제', go, true); return false; }
      go(); return false;
    },
    'tk.add': function (el) {
      var code = RB.normCode(el.dataset.code), sec = ($('#tkSec') || {}).value || SECTORS[0];
      if (!code || code === CASH || RB.tickerOf(S, code)) return false;
      var q = S.quotes.map[code];
      S.tickers.push({ code: code, sector: sec, name: q ? q.n : '', short: '', memo: '', safe: RB.SAFE_SECTORS.indexOf(sec) >= 0, sellMin: 0, buyMax: 0, manual: 0 });
      toast((q ? q.n : code) + '을(를) ' + sec + '에 추가했습니다.');
      if (!q) Feed.manual();
    },
    'tk.set': function (el) {
      var t = S.tickers[+el.dataset.i], f = el.dataset.f;
      if (f === 'safe') t.safe = el.checked;
      else if (f === 'sector') t.sector = el.value;
      else if (f === 'short' || f === 'memo') t[f] = el.value.trim().slice(0, f === 'short' ? 40 : 120);
      else t[f] = Math.max(0, num(el.value));
    },
    'tk.del': function (el) {
      var i = +el.dataset.i, t = S.tickers[i];
      var usedIn = S.accounts.filter(function (a) { return a.rows.some(function (r) { return r.code === t.code; }); });
      if (usedIn.length) { toast('이 종목은 ' + usedIn.map(function (a) { return a.name; }).join(', ') + '에서 쓰고 있습니다. 계좌의 행을 먼저 지우십시오.'); return false; }
      S.tickers.splice(i, 1);
    },
    'plan.pct': function (el) { S.plan.rounds[+el.dataset.r].pct = num(el.value); fixPcts(S.plan); },
    'plan.date': function (el) { S.plan.rounds[+el.dataset.r].date = /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : ''; },
    'plan.dep': function (el) { var r = S.plan.rounds[+el.dataset.r], id = S.accounts[+el.dataset.a].id, v = Math.max(0, num(el.value)); if (v) r.deposits[id] = v; else delete r.deposits[id]; },
    'plan.n': function (el) { replan(el.dataset.n); toast('남은 구간을 ' + S.plan.rounds.length + '회로 균등하게 나눴습니다.'); },
    'plan.sel': function (el) { ui.round = +el.dataset.r; },
    'plan.base': function () { RB.setBaseline(S); toast('지금 잔고를 새 기준으로 삼았습니다.'); },
    'plan.restart': function () {
      confirmDlg('새 계획으로 다시 시작', '모든 회차를 미완료로 되돌리고 지금 잔고를 새 출발점으로 삼습니다. 보유수량과 이력은 그대로 둡니다.', '다시 시작', function () {
        var n = S.plan.rounds.length; S.plan = RB.newPlan(n); RB.setBaseline(S); ui.round = null; save(); render();
      });
      return false;
    },
    'plan.exec': function (el) { openExec(+el.dataset.r); return false; },
    'hist.undo': function () {
      confirmDlg('반영 되돌리기', '가장 최근에 반영한 체결을 취소하고 보유수량과 예수금을 반영 전으로 돌립니다.', '되돌리기', function () { var e = RB.undoLast(S); ui.round = null; save(); render(); if (e) toast(e.round + '회차 반영을 되돌렸습니다.'); }, true);
      return false;
    },
    'data.xlsx': function () { $('#fileXlsx').click(); return false; },
    'data.json': function () { $('#fileJson').click(); return false; },
    'data.save': function () { saveBackup(); return false; },
    'data.export': function () { exportXlsx(); return false; },
    'data.reset': function () {
      confirmDlg('모두 지우기', '이 브라우저에 저장된 계좌·종목·목표·회차 계획·이력을 모두 지웁니다. 되돌릴 수 없습니다.', '모두 지우기', function () {
        var q = S.quotes; S = RB.newState(); S.quotes = q; ui.round = null; ui.tab = 'hold';
        try { localStorage.removeItem(LS_STATE); } catch (e) { /* 무시 */ }
        save(); render();
      }, true);
      return false;
    },
    'set.refresh': function (el) { S.settings.refreshSec = num(el.value); },
    'set.risk': function (el) { S.settings.riskLimit = RB.clamp(num(el.value) || 70, 1, 100); }
  };
  function run(el) {
    var fn = ACT[el.dataset.act];
    if (!fn) return;
    if (fn(el) === false) return;
    if (S.plan.baseGap == null && S.accounts.length) { var a = RB.calcAll(S); if (a.planOk && a.gap > 0) RB.setBaseline(S); }
    save(); queueRender();
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-tab],[data-act],[data-dlg]') : null;
    if (!t) return;
    if (t.dataset.tab) { ui.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.dlg) {
      var kind = t.dataset.dlg;
      if (kind === 'cancel') { confirmFn = null; closeDlg(); }
      else if (kind === 'yes') { var fn = confirmFn; confirmFn = null; closeDlg(); if (fn) fn(); }
      else if (kind === 'exec') doExec(+t.dataset.r);
      return;
    }
    if (t.tagName === 'BUTTON') run(t);
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'fileXlsx') { if (t.files[0]) importXlsx(t.files[0]); t.value = ''; return; }
    if (t.id === 'fileJson') { if (t.files[0]) importJson(t.files[0]); t.value = ''; return; }
    if (t.id === 'tkSec') { ui.tkSec = t.value; return; }
    if (t.dataset && t.dataset.act && t.tagName !== 'BUTTON' && t.closest('#view')) run(t);
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'tkQ') { ui.tkQ = e.target.value; searchTickers(e.target.value); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.closest('#view') && e.target.type !== 'checkbox') e.target.blur();
  });
  document.addEventListener('focusout', function () { if (dirtyQuotes) setTimeout(function () { if (dirtyQuotes && !isEditing() && !$('#dlg').open) render(); }, 60); });
  $('#dlg').addEventListener('cancel', function () { confirmFn = null; setTimeout(function () { $('#dlg').innerHTML = ''; if (dirtyQuotes) render(); }, 0); });
  $('#btnRefresh').addEventListener('click', function () {
    var b = this; b.disabled = true;
    Feed.manual().then(function () { b.disabled = false; toast(Feed.status === 'ok' ? '시세를 새로 받았습니다.' : '시세를 받지 못했습니다. 잠시 뒤 다시 시도하십시오.'); });
  });
  document.addEventListener('toggle', function (e) { if (e.target && e.target.id === 'depBox') ui.depOpen = e.target.open; }, true);
  var lastNarrow = window.innerWidth < 720;
  window.addEventListener('resize', function () { var n = window.innerWidth < 720; if (n !== lastNarrow) { lastNarrow = n; if (!isEditing() && !$('#dlg').open) render(); } });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') Feed.tick(); });

  if (S.plan.baseGap == null && S.accounts.length) { var a0 = RB.calcAll(S); if (a0.planOk && a0.gap > 0) RB.setBaseline(S); }
  render();
  Feed.start();
  window.__rebal = { state: function () { return S; }, feed: Feed };
})();

</script>
</body>
</html>
